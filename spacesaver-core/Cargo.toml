[package]
name = "spacesaver-core"
version = "0.1.0"
edition = "2021"
description = "NASA image screensaver core library"
license = "MIT"

[lib]
name = "spacesaver_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
image = "0.24"
rand = "0.8"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
parking_lot = "0.12"
once_cell = "1.18"

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
cbindgen = "0.26"
